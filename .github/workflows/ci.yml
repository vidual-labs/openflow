name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend test suite
        working-directory: backend
        run: npm test -- --forceExit

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Dependency-audit findings are surfaced but never block a PR on their
    # own (transitive advisories can lag a fix, or be irrelevant to how a
    # package is actually used) — see them in the job log/summary instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Backend npm audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
