services:
  app:
    # `docker compose pull && docker compose up -d` uses the published image
    # below (no local build needed); `docker compose up -d --build` still
    # builds from source, e.g. for contributors or a customized Dockerfile.
    image: ghcr.io/vidual-labs/openflow:${OPENFLOW_VERSION:-latest}
    build: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/openflow.db
      # Leave ADMIN_PASSWORD unset here rather than defaulting it to a known
      # value: the app prints a random one-time admin password to the log
      # when it is absent. (JWT_SECRET is no longer used since 0.44; login
      # sessions are stored server-side.)
      # Encrypts integration secrets (SMTP passwords, API keys) in the DB. Left
      # empty, a key is generated into the db-data volume, i.e. next to the
      # data it protects, so set it in .env for production and back it up
      # separately. Switching an existing install over is safe: the old
      # auto-generated key is still used to read what it encrypted.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Set to true to block SMTP hosts on private networks/localhost too (the
      # cloud metadata service is always blocked). Leave unset if you relay
      # mail through a server on your own network.
      - SMTP_BLOCK_PRIVATE_HOSTS=${SMTP_BLOCK_PRIVATE_HOSTS:-}
      # OpenFlow's own outgoing mail: two-factor login codes and security
      # notices. Without SMTP_HOST, users can't turn on two-factor login.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Emergency switch: set to true while e-mail is broken so accounts with
      # two-factor login can still sign in with their password. Remove after.
      - OPENFLOW_2FA_DISABLED=${OPENFLOW_2FA_DISABLED:-}
      # Behind a reverse proxy (Nginx, Traefik, a load balancer…) set this to
      # the number of proxies in front (usually 1), so rate limits and the
      # stored submitter IP use the visitor's address, not the proxy's.
      # Implied (=1) when OPENFLOW_PRIMARY_HOST is set.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # Set to true to show the marketing landing page at / to logged-out
      # visitors (the login moves to /login). Off by default.
      - OPENFLOW_LANDING_PAGE=${OPENFLOW_LANDING_PAGE:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@openflow.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Scheduled backups: written every BACKUP_INTERVAL_HOURS, keeping the
      # last BACKUP_RETENTION_COUNT. BACKUP_DIR below points at a bind mount
      # (./backups on the host) instead of the db-data volume, so a lost or
      # corrupted db-data volume doesn't take the backups down with it. Copy
      # ./backups off this host regularly for real disaster recovery.
      - BACKUP_DIR=/app/backups
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-14}
    volumes:
      - db-data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    # Baseline resource cap so a runaway process (or an abusive request
    # pattern) can't take down the whole host. Raise if your form/submission
    # volume needs more headroom.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g

volumes:
  db-data:
