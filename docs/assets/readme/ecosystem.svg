<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">OpenFlow, calon and lodgely</title>
<desc id="d">A visitor answers an OpenFlow form. OpenFlow reads free slots from calon and books the picked slot there; calon syncs bookings with Google Calendar or Microsoft 365. lodgely pulls the finished leads from OpenFlow with a read-only API token, and OpenFlow can also push each lead to webhooks, e-mail, Google Sheets, Google Ads and Meta.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6C5CE7"/><stop offset="1" stop-color="#00CEC9"/></linearGradient>
  <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="88" y2="0"><stop stop-color="#8B7DF0"/><stop offset="1" stop-color="#00CEC9"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6C5CE7" stop-opacity=".28"/><stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/></radialGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#5B5590"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .card{fill:#1D1940;stroke:#363063;stroke-width:1.2}
    .h{fill:#F4F2FF;font-size:18px;font-weight:600}
    .s{fill:#A7A3C9;font-size:13px}
    .l{fill:#8F8AB8;font-size:12px}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7C77A8;font-size:11px}
    .edge{fill:none;stroke:#3F3A6E;stroke-width:2}
    .flow{fill:none;stroke:url(#brand);stroke-width:2;stroke-dasharray:3 9;animation:dash 1.2s linear infinite;opacity:.55}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){.dot,.flow{display:none}.pulse{animation:none}}
  </style>
</defs>

<rect width="960" height="520" rx="22" fill="#14112B"/>
<ellipse cx="480" cy="215" rx="320" ry="210" fill="url(#glow)"/>

<!-- edges -->
<path id="e-ans" class="edge" d="M232 205H381" marker-end="url(#arr)"/>
<path id="e-lead" class="edge" d="M579 205H726" marker-end="url(#arr)"/>
<path id="e-book" class="edge" d="M455 284V356" marker-end="url(#arr)"/>
<path id="e-slots" class="edge" d="M505 356V284" marker-end="url(#arr)"/>
<path id="e-sync" class="edge" d="M381 410H234" marker-start="url(#arr)" marker-end="url(#arr)"/>
<path id="e-push" class="edge" d="M579 255C650 255 650 410 726 410" marker-end="url(#arr)"/>
<path class="flow" d="M232 205H381"/>
<path class="flow" d="M579 205H726"/>

<!-- edge labels -->
<text class="l" x="306" y="192" text-anchor="middle">answers</text>
<text class="l" x="652" y="186" text-anchor="middle">pulls leads</text>
<text class="m" x="652" y="228" text-anchor="middle">read-only ofw_ token</text>
<text class="l" x="443" y="316" text-anchor="end">books the slot</text>
<text class="m" x="443" y="332" text-anchor="end">POST /bookings</text>
<text class="l" x="517" y="316">free slots</text>
<text class="m" x="517" y="332">GET /availability</text>
<text class="l" x="308" y="398" text-anchor="middle">busy / booked</text>
<text class="l" x="690" y="322" text-anchor="middle">pushes</text>

<!-- visitor -->
<rect class="card" x="40" y="150" width="190" height="110" rx="14"/>
<g transform="translate(60 172)">
  <rect width="26" height="30" rx="5" fill="none" stroke="#A7A3C9" stroke-width="1.6"/>
  <path d="M6 9h14M6 15h10M6 21h12" stroke="#A7A3C9" stroke-width="1.6" stroke-linecap="round"/>
</g>
<text class="h" x="98" y="194">Visitor</text>
<text class="s" x="60" y="228">fills in a form on your</text>
<text class="s" x="60" y="245">site, link or subdomain</text>

<!-- OpenFlow -->
<rect x="383" y="126" width="194" height="156" rx="16" fill="#221D4C" stroke="url(#brand)" stroke-width="2"/>
<rect class="pulse" x="383" y="126" width="194" height="156" rx="16" fill="none" stroke="#6C5CE7" stroke-opacity=".5" stroke-width="6"/>
<path transform="translate(436 146) scale(.62)" fill="none" stroke="url(#mark)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M83.5 30.5c-10-2-10 12-18 12s-10-12-16-20A20 20 0 1 0 49.5 41.5"/>
<text class="h" x="480" y="216" text-anchor="middle" font-size="20">OpenFlow</text>
<text class="s" x="480" y="240" text-anchor="middle">forms · logic · analytics</text>
<text class="m" x="480" y="262" text-anchor="middle">this repo</text>

<!-- lodgely -->
<rect class="card" x="728" y="150" width="192" height="110" rx="14"/>
<g transform="translate(748 172)" fill="none" stroke="#00CEC9" stroke-width="1.6" stroke-linejoin="round">
  <path d="M2 14 14 3l12 11v15H2z"/><path d="M10 29v-8h8v8"/>
</g>
<text class="h" x="786" y="194">lodgely</text>
<text class="s" x="748" y="228">lead intake hub: leads</text>
<text class="s" x="748" y="245">land in the right client</text>

<!-- calon -->
<rect class="card" x="383" y="358" width="194" height="110" rx="14"/>
<g transform="translate(403 378)" fill="none" stroke="#8B7DF0" stroke-width="1.6">
  <rect x="1" y="4" width="26" height="25" rx="4"/><path d="M1 12h26M8 1v6M20 1v6" stroke-linecap="round"/>
</g>
<text class="h" x="441" y="400">calon</text>
<text class="s" x="403" y="434">booking engine with</text>
<text class="s" x="403" y="451">conflict-checked slots</text>

<!-- calendar -->
<rect class="card" x="40" y="358" width="190" height="110" rx="14"/>
<g transform="translate(60 380)">
  <rect width="12" height="12" rx="2" fill="#4285F4"/><rect x="14" width="12" height="12" rx="2" fill="#34A853"/>
  <rect y="14" width="12" height="12" rx="2" fill="#FBBC04"/><rect x="14" y="14" width="12" height="12" rx="2" fill="#0078D4"/>
</g>
<text class="h" x="98" y="400">Calendar</text>
<text class="s" x="60" y="434">Google Calendar or</text>
<text class="s" x="60" y="451">Microsoft 365</text>

<!-- push integrations -->
<rect class="card" x="728" y="358" width="192" height="110" rx="14" stroke-dasharray="4 4"/>
<text class="h" x="748" y="390" font-size="15">Push integrations</text>
<text class="s" x="748" y="416">Webhooks · E-mail</text>
<text class="s" x="748" y="434">Google Sheets</text>
<text class="s" x="748" y="452">Google Ads · Meta CAPI</text>

<text class="m" x="40" y="500">Each app is self-hosted in its own container. calon and lodgely are optional.</text>

<!-- moving data: one 7.5 s story, each hop takes 1.5 s -->
<g class="dot">
  <circle r="5" opacity="0" fill="#8B7DF0"><animateMotion dur="7.5s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#e-slots"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
  <circle r="5" opacity="0" fill="#F4F2FF"><animateMotion dur="7.5s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#e-ans"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="1.5s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
  <circle r="5" opacity="0" fill="#8B7DF0"><animateMotion dur="7.5s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#e-book"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="3s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
  <circle r="5" opacity="0" fill="#34A853"><animateMotion dur="7.5s" begin="4.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear" ><mpath href="#e-sync"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="4.5s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
  <circle r="5" opacity="0" fill="#00CEC9"><animateMotion dur="7.5s" begin="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#e-lead"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
  <circle r="5" opacity="0" fill="#00CEC9"><animateMotion dur="7.5s" begin="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#e-push"/></animateMotion><animate attributeName="opacity" dur="7.5s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.18;.2;1"/></circle>
</g>
</svg>
