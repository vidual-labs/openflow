<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="t d">
<title id="t">A multi-step OpenFlow form</title>
<desc id="d">One question per screen: the visitor picks an answer, sets a number, and the form ends on a thank-you screen while the progress bar fills.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6C5CE7"/><stop offset="1" stop-color="#00CEC9"/></linearGradient>
  <radialGradient id="bg1" cx="15%" cy="100%" r="80%"><stop stop-color="#6C5CE7" stop-opacity=".22"/><stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg2" cx="95%" cy="90%" r="70%"><stop stop-color="#00CEC9" stop-opacity=".25"/><stop offset="1" stop-color="#00CEC9" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x="1" y="1" width="438" height="298" rx="18"/></clipPath>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1F1B3A}
    .lab{fill:#6C5CE7;font-size:10px;font-weight:600;letter-spacing:.08em}
    .q{font-size:19px;font-weight:700}
    .o{font-size:13px}
    .opt{fill:#fff;fill-opacity:.7;stroke:#D9D5F0}
    .scr{opacity:0;animation:9s linear infinite}
    .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
    @keyframes s1{0%{opacity:0;transform:translateX(18px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateX(-18px)}}
    @keyframes s2{0%,33%{opacity:0;transform:translateX(18px)}37%,63%{opacity:1;transform:none}67%,100%{opacity:0;transform:translateX(-18px)}}
    @keyframes s3{0%,66%{opacity:0;transform:translateY(8px)}71%,95%{opacity:1;transform:none}100%{opacity:0}}
    .sel{opacity:0;animation:sel 9s linear infinite}
    @keyframes sel{0%,14%{opacity:0}17%,100%{opacity:1}}
    .n3{animation:n3 9s steps(1) infinite}.n4{opacity:0;animation:n4 9s steps(1) infinite}
    @keyframes n3{0%,50%{opacity:1}51%,100%{opacity:0}}
    @keyframes n4{0%,50%{opacity:0}51%,100%{opacity:1}}
    .press{animation:press 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes press{0%,49%{transform:none}50.5%{transform:scale(.88)}53%,100%{transform:none}}
    .bar{transform-box:fill-box;transform-origin:left;animation:bar 9s ease-in-out infinite}
    @keyframes bar{0%,31%{transform:scaleX(.33)}36%,64%{transform:scaleX(.66)}69%,95%{transform:scaleX(1)}100%{transform:scaleX(.33)}}
    .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick 9s ease-out infinite}
    @keyframes tick{0%,70%{stroke-dashoffset:40}76%,100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.scr,.sel,.n3,.n4,.press,.bar,.tick{animation:none}.s1,.sel{opacity:1}.s2,.s3,.n4{opacity:0}}
  </style>
</defs>

<g clip-path="url(#card)">
  <rect width="440" height="300" fill="#F7F6FE"/>
  <rect width="440" height="300" fill="url(#bg1)"/>
  <rect width="440" height="300" fill="url(#bg2)"/>
  <rect y="0" width="440" height="4" fill="#E6E3F5"/>
  <rect class="bar" y="0" width="440" height="4" fill="url(#brand)"/>
</g>
<rect x="1" y="1" width="438" height="298" rx="18" fill="none" stroke="#E2DFF3" stroke-width="1.5"/>

<!-- step 1: single choice -->
<g class="scr s1">
  <text class="lab" x="40" y="52">ROOF</text>
  <text class="q" x="40" y="80">Which way does your roof face?</text>
  <rect class="opt" x="40" y="100" width="250" height="36" rx="9"/>
  <rect class="sel" x="40" y="100" width="250" height="36" rx="9" fill="#6C5CE7" fill-opacity=".12" stroke="#6C5CE7" stroke-width="1.6"/>
  <text class="o" x="56" y="123">South</text>
  <rect class="opt" x="40" y="144" width="250" height="36" rx="9"/><text class="o" x="56" y="167">East / West</text>
  <rect class="opt" x="40" y="188" width="250" height="36" rx="9"/><text class="o" x="56" y="211">Flat roof</text>
  <rect x="40" y="244" width="78" height="32" rx="8" fill="url(#brand)"/>
  <text x="56" y="265" font-size="13" font-weight="600" style="fill:#fff">Next →</text>
</g>

<!-- step 2: number stepper -->
<g class="scr s2">
  <text class="lab" x="40" y="52">HOUSEHOLD</text>
  <text class="q" x="40" y="80">How many people live there?</text>
  <rect x="40" y="104" width="52" height="52" rx="12" fill="#fff" stroke="#D9D5F0"/>
  <text x="66" y="138" font-size="24" text-anchor="middle" style="fill:#6C5CE7">−</text>
  <text class="n3" x="132" y="141" font-size="30" font-weight="700" text-anchor="middle">3</text>
  <text class="n4" x="132" y="141" font-size="30" font-weight="700" text-anchor="middle">4</text>
  <g class="press">
    <rect x="172" y="104" width="52" height="52" rx="12" fill="#6C5CE7"/>
    <text x="198" y="139" font-size="24" text-anchor="middle" style="fill:#fff">+</text>
  </g>
  <rect x="40" y="244" width="78" height="32" rx="8" fill="url(#brand)"/>
  <text x="56" y="265" font-size="13" font-weight="600" style="fill:#fff">Next →</text>
</g>

<!-- step 3: end screen -->
<g class="scr s3">
  <circle cx="220" cy="118" r="30" fill="url(#brand)"/>
  <path class="tick" d="M206 119l10 10 19-21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="186" text-anchor="middle" font-size="19" font-weight="700">Thanks — your quote is on its way!</text>
  <text x="220" y="210" text-anchor="middle" font-size="13" style="fill:#5D5878">An advisor will call you within one business day.</text>
</g>
</svg>
